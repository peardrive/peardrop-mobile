// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

// react-native-b4a, -bare-kit and -fs ask for AGP `+` from mavenCentral only: force the app's AGP,
// and add google() because AGP is not on mavenCentral, so an uncached machine cannot resolve it.
subprojects {
  buildscript {
    repositories {
      google()
      mavenCentral()
    }
  }
  buildscript.configurations.matching { it.name == 'classpath' }.configureEach {
    resolutionStrategy.force 'com.android.tools.build:gradle:8.11.0'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
