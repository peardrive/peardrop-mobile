// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

// react-native-b4a, react-native-bare-kit and react-native-fs each declare
// their own buildscript with `classpath 'com.android.tools.build:gradle:+'`
// (or an ancient pin) resolved against mavenCentral() only. Two things are
// needed to tame them:
//   1. force the AGP the app module already uses (was: resolves to an alpha
//      that requires Gradle 9 and fails this Gradle 8.x build), and
//   2. give those subproject buildscripts google() — AGP is published there,
//      NOT on mavenCentral, so without this the forced version can't be found
//      ("Could not find com.android.tools.build:gradle:8.11.0"). It only built
//      before on machines that already had AGP cached under ~/.gradle.
// Remove once those packages pin their own selector + repo upstream.
subprojects {
  buildscript {
    repositories {
      google()
      mavenCentral()
    }
  }
  buildscript.configurations.matching { it.name == 'classpath' }.configureEach {
    resolutionStrategy.force 'com.android.tools.build:gradle:8.11.0'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
